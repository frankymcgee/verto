<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Verto Mobile Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #e5e7eb;
        border-radius: 24px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
      }

      img {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: block;
        object-fit: cover;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 22px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #475569;
        font-size: 15px;
        line-height: 1.5;
      }

      button {
        width: 100%;
        margin-top: 20px;
        border: 0;
        border-radius: 14px;
        background: #111827;
        color: #ffffff;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/verto/images/verto-icon.png" alt="Verto" />
      <h1>Verto Mobile is offline</h1>
      <p>The app shell is available, but this page could not be loaded from the network. Reconnect and try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
