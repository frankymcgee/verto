<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />

    <title>MSS</title>

    <meta
      name="description"
      content="PWA Companion app for Mine Site Support"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#171717"
    />

    <meta
      name="background-color"
      content="#171717"
    />

    <!-- PWA manifest generated by vite-plugin-pwa -->
    <link
      rel="manifest"
      href="/assets/verto/verto-mobile/manifest.webmanifest"
    />

    <!-- iOS Safari uses these for Add to Home Screen more reliably than the web manifest. -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="MSS"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/verto/manifest/apple-touch-icon.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="/assets/verto/manifest/mss-pwa-192.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/assets/verto/manifest/mss-pwa-512.png"
    />

    <!-- Normal browser favicon. Keep this separate from the PWA install icon. -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/verto/manifest/mss-pwa-192.png"
    />
    <script type="module" crossorigin src="/assets/verto/verto-mobile/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/verto/verto-mobile/assets/index.css">
  <link rel="manifest" href="/assets/verto/verto-mobile/manifest.webmanifest"></head>

  <body>
    <div id="app"></div>

  </body>
</html>
