name: Verto v16 CI

on:
  push:
    branches:
      - version-16
  pull_request:

concurrency:
  group: verto-v16-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  planner-ui:
    runs-on: ubuntu-latest
    name: Planner UI regressions
    steps:
      - name: Checkout Verto
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install planner dependencies
        working-directory: planner
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile
      - name: Run planner UI regressions
        working-directory: planner
        run: yarn test:ui

  validation:
    runs-on: ubuntu-latest
    name: Frappe v16 fresh install validation

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -proot" --health-interval=5s --health-timeout=3s --health-retries=10

    steps:
      - name: Checkout Verto
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client redis-tools

      - name: Install Bench
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade frappe-bench

      - name: Initialise Frappe v16 bench
        run: |
          bench init \
            --frappe-branch version-16 \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench

      - name: Fetch Verto dependencies
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-16 erpnext https://github.com/frappe/erpnext.git
          bench get-app --branch version-16 hrms https://github.com/frappe/hrms.git
          bench get-app gameplan https://github.com/frappe/gameplan.git
          bench get-app raven https://github.com/frappe/raven.git
          bench get-app verto "$GITHUB_WORKSPACE"
          bench setup requirements --dev

      - name: Create fresh site and install Verto
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          bench new-site \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-root-password root \
            --admin-password admin \
            test_site
          bench --site test_site install-app verto
          bench --site test_site migrate

      - name: Run planner task, leave and staffing regressions
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
        run: |
          bench --site test_site run-tests \
            --app verto \
            --module verto.api.test_planner \
            --case TestPlannerAppendGenericTasks \
            --skip-before-tests
          bench --site test_site run-tests \
            --app verto \
            --module verto.api.test_planner_leave \
            --skip-before-tests
          bench --site test_site run-tests \
            --app verto \
            --module verto.api.test_planner_staffing \
            --skip-before-tests

      - name: Verify whiteboard pages and access controls
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
        run: |
          node --test apps/verto/tests/whiteboard-pages.test.mjs
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app verto --module verto.api.test_whiteboard --skip-before-tests

      - name: Build Verto assets
        working-directory: /home/runner/frappe-bench
        run: |
          bench build --app verto

      - name: Verify Voice JHA engines and incident learning
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
        run: |
          ./env/bin/python -m unittest discover -s apps/verto/tests -p 'test_jha_risk_signals.py'
          bench --site test_site run-tests --app verto --module verto.api.mobile.test_voice_jha_incidents --skip-before-tests
          bench --site test_site run-tests --app verto --module verto.api.mobile.test_voice_jha_live --skip-before-tests
          cd apps/verto/frontend
          yarn test:ui tests/jha-incident-learning.test.js tests/jha-voice-protocol.test.js tests/jha-voice-engines.test.js

      - name: Verify Daily Timesheet hour-limit alerts
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
        run: |
          bench --site test_site run-tests --app verto --module verto.api.mobile.test_timesheet_hour_limits --skip-before-tests

      - name: Verify automated Verto setup
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute verto.install.ensure_verto_setup
          bench --site test_site execute verto.runtime_config.get_push_settings_config
          bench --site test_site execute verto.health.collect_system_health
