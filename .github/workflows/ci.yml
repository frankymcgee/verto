name: Verto v16 CI

on:
  push:
    branches: [develop, version-16]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      fresh_install:
        description: Also validate a completely fresh Verto site
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: verto-v16-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    name: Select Verto CI checks
    outputs:
      integration: ${{ steps.plan.outputs.integration }}
      fresh: ${{ steps.plan.outputs.fresh }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks and dependency image
        id: plan
        shell: bash
        run: |
          python ci/plan.py
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-ci:$(python ci/image_key.py)" >> "$GITHUB_OUTPUT"

  ci-config:
    runs-on: ubuntu-latest
    name: CI configuration regressions
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check cache invalidation, event routing and shell syntax
        run: |
          python -m unittest discover -s ci/tests -v
          for script in ci/*.sh; do bash -n "$script"; done

  local-voice:
    runs-on: ubuntu-latest
    name: Optional local speech protocol
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/local_voice/requirements.txt
      - name: Install isolated speech gateway dependencies
        run: python -m pip install -r services/local_voice/requirements.txt requests
      - name: Verify speech streaming, interruption, tenant isolation and WebRTC
        run: |
          python -m unittest discover -s services/local_voice/tests -v
          python -m unittest discover -s tests -p 'test_local_voice_bridge.py' -v

  mobile-forms:
    runs-on: ubuntu-latest
    name: Mobile form row saves and offline updates
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install mobile dependencies
        working-directory: frontend
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive
      - name: Verify one-step row saves and offline persistence
        working-directory: frontend
        run: yarn test:ui tests/child-row-save.test.js tests/mobile-ui.test.js tests/form-controls.test.js tests/rating-fields.test.js tests/offline-sync.test.js tests/offline-request-efficiency.test.js tests/failed-uploads.test.js tests/profile-menu.test.js

  planner-ui:
    runs-on: ubuntu-latest
    name: Planner UI regressions
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: planner/yarn.lock
      - name: Install planner dependencies
        working-directory: planner
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive
      - name: Run planner UI regressions
        working-directory: planner
        run: yarn test:ui
      - name: Verify Desk Gantt, geolocation loading and public attachment picker
        run: node --test tests/gantt-view.test.mjs tests/geolocation-loading.test.mjs tests/web-form-attachments.test.mjs

  validation:
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-latest
    name: Frappe v16 integration validation
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Read the prepared image from GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore clean seed, migrate current Verto and run all regressions
        env:
          CI_IMAGE: ${{ needs.plan.outputs.image }}
        run: bash ci/use-image.sh "$CI_IMAGE" integration

  fresh-install:
    needs: plan
    if: needs.plan.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    name: Frappe v16 fresh install validation
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install current Verto on a blank site using the prepared stack
        env:
          CI_IMAGE: ${{ needs.plan.outputs.image }}
        run: bash ci/use-image.sh "$CI_IMAGE" fresh
