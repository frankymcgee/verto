<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verto Mobile Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f9fafb;
        color: #111827;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 420px;
        width: 100%;
        border: 1px solid #e5e7eb;
        border-radius: 24px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      }

      img {
        width: 56px;
        height: 56px;
        border-radius: 16px;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0;
        color: #4b5563;
        line-height: 1.5;
      }

      button {
        margin-top: 20px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: #2563eb;
        color: white;
        padding: 12px 16px;
        font-weight: 700;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/verto/images/verto-icon.png" alt="Verto" />
      <h1>You are offline</h1>
      <p>Verto Mobile could not connect. Reconnect to the internet and try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
