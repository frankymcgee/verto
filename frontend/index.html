<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />

    <title>Verto</title>

    <meta
      name="description"
      content="Mobile companion app for Verto"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#171717"
    />

    <meta
      name="background-color"
      content="#171717"
    />

    <!-- Build-time fallback. Runtime metadata is replaced from Verto Mobile Settings. -->
    <link
      rel="manifest"
      href="/files/verto-mobile-manifest.webmanifest"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Verto"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/verto/manifest/apple-touch-icon.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="/assets/verto/manifest/mss-pwa-192.png"
    />

    <link
      rel="icon"
      type="image/png"
      href="/assets/verto/manifest/mss-pwa-192.png"
    />
  </head>

  <body>
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
