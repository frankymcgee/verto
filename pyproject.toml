[project]
name = "verto"
authors = [
    { name = "Webwire", email = "support@webwire.com.au"}
]
description = "a custom app developed for integrating a Work Health and Safety Managemnet System for business using ERPNext"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "python-docx>=1.1.0",
]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"
gameplan = ">=0.0.1"
raven = ">=2.0.0,<5.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
