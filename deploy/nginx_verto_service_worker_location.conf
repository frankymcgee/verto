# Add this location inside the dashboard.minesitesupport.com.au HTTPS server block.
# Adjust the bench path if this tenant is installed elsewhere.

location = /verto-mobile-sw.js {
    alias /home/mss-erpnext/frappe-bench/apps/verto/verto/public/pwa/verto-mobile-sw.js;
    default_type application/javascript;
    add_header Service-Worker-Allowed /verto-mobile/ always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
}
